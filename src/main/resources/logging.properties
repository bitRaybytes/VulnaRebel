# Root logger - INFO and above to console only
handlers=java.util.logging.ConsoleHandler
.level=INFO

# Console format - readable single line
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$s] %3$s - %5$s%n

# Verbose logging of any layer during development
database.level=FINE
http.level=INFO
challenge.level=INFO
config.level=INFO