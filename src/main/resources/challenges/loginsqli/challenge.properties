# Identity
challenge.name=Login SQL Injection
challenge.scripts=
challenge.subtitle=Login to reveal the flag.
challenge.difficulty=Easy
challenge.difficultyColor=#2E7D32
challenge.objective=Investigate the login form for security weaknesses. \
Your goal is to gain access without knowing a valid username or password.

# challenge hints
challenge.hint.1=Think about escaping the syntax<br>
challenge.hint.2=Let's suppose that this is a legitimate SaaS plattform where you have a valid profile.<br> \
Then there must be a query behind this form. <br>
challenge.hint.3=So a database query to this specific login form and architecture will be something close to this: <br>\
`SELECT * FROM login_users WHERE username = 'YourUsername' AND password = 'YourSuperSecretPassword';`\
<br>So the question is: how can you escape this?

# Flag
challenge.flag=ctf{That_Was_Easy_For_You}
challenge.message.invalid=Invalid credentials.

# Web
challenge.route=/login-sql-injection

