# Article related
article.title=Union-Based SQL Injection
article.subtitle=Learn how UNION SELECT is abused to retrieve information from \
  database tables that were never intended to be exposed.

article.introduction.title=What is Union-Based SQL Injection?
article.introduction.text=<strong>Union-Based SQL Injection</strong> is a SQL Injection \
  technique that allows an attacker to append the results of a second SQL query to the \
  application's original query using the SQL `UNION` operator.<br><br> \
  Unlike authentication bypass, the objective is not to log in, but to retrieve \
  arbitrary data from the database.<br><br> \
  When successful, an attacker can read information such as usernames, password hashes, \
  configuration values, database versions, or other sensitive application data.

article.mechanism.title=How does it work?
article.mechanism.text=Consider the following vulnerable query: \
  `SELECT name, category, price, description FROM products WHERE name LIKE '%input%'`. <br>\
  If user input is concatenated directly into the SQL statement, an attacker can terminate \
  the original query and append a second one using the `UNION` operator.<br><br>\
  Both queries must return the same number of columns and compatible data types. \
  Before extracting information, attackers typically determine the number of returned columns \
  using payloads such as <br><br>`' ORDER BY 1 --`, `' ORDER BY 2 --`,<br><br> and so on, or by \
  experimenting with `UNION SELECT NULL,...`.

article.exploitation.title=How can it be exploited?
article.exploitation.text=After determining the correct column count, attackers identify which \
  columns are reflected in the application's response. They often inject easily \
  recognizable values such as `' UNION SELECT NULL,'TEST',NULL,NULL --`.<br><br>\
  Once reflected columns are identified, arbitrary database data can be retrieved. \
  Examples include reading configuration tables, enumerating users, obtaining the \
  database version with `version()`, determining the current database user using \
  `current_user`, or extracting sensitive information from application-specific tables.<br>\
  UNION-based SQL Injection is one of the most powerful SQLi techniques because it returns \
  the stolen data directly within the application's normal response.

article.defense.title=How can it be prevented?
article.defense.text=Union-Based SQL Injection is prevented in exactly the same way as every \
  other form of SQL Injection: by using parameterized queries (Prepared Statements). User input \
  must never be concatenated into SQL statements. <br><br> \
  `PreparedStatement`s separate SQL code from user-controlled values, preventing injected SQL \
  syntax from being interpreted by the database. Additional defensive measures include validating \
  input, minimizing database privileges, avoiding verbose database error messages, and applying the \
  principle of least privilege. While these measures improve security, properly parameterized queries \
  remain the primary and most effective defense.

