# Identity
challenge.name=Blind SQL Injection
challenge.scripts=
challenge.subtitle=Almost silent - but not quite.
challenge.difficulty=Medium
challenge.difficultyColor=#EF6C00
challenge.objective=This user search form is connected to a database. \
It only ever responds with <em>"User found"</em> or <em>"User not found"</em> - nothing more.<br><br>\
Somewhere in the database is a <strong>secret</strong> column that is never shown to you directly. \
Your goal is to extract its value one character at a time and submit the flag below.

# challenge hints
challenge.hint.1=The application only tells you <em>true</em> or <em>false</em>. \
What if you could turn a SQL query into a yes/no question?<br>
challenge.hint.2=The query behind this form looks something like:<br> \
<code>SELECT username FROM blind_users WHERE username = 'your_input'</code><br> \
It returns nothing visible - just whether a row was found. \
Can you append a condition that tests a single character?<br>
challenge.hint.3=Look up <code>SUBSTRING(column, position, 1)</code> in PostgreSQL.<br> \
If you can make the query return "User found" only when a specific \
character matches, you can extract the secret one character at a time.<br>\
Example shape (fill in the blanks):<br> \
<code>admin' AND SUBSTRING(secret, 1, 1)='?' --</code>

# Flag
challenge.flag=ctf{Bl1nD_Bu7_N0t_D34f}

#web
challenge.route=/blindsqli
challenge.route.submit=/blindsqli/submit
challenge.htmlPlaceholder={{resultDisplay}}

# Database
challenge.initialize=blindsqli
challenge.table=blind_users
challenge.db.allow_multi_queries=false