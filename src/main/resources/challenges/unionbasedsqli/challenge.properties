# Identity
challenge.name=Union Based SQL Injection
challenge.scripts=
challenge.subtitle=Stack, unite, and conquer backend vulnerabilities.
challenge.difficulty=Medium
challenge.difficultyColor=#EF6C00
challenge.objective=The search functionality retrieves products from the database. \
However, the application may trust user input more than it should.<br><br> \
Your task is to identify the SQL injection point, determine the query structure, \
and use <strong>UNION SELECT</strong> to combine your own query with the original one.<br><br> \
Retrieve the hidden value stored inside the database and submit the flag.

# challenge hints
challenge.hint.1=The search functionality displays information retrieved from the database.<br>\
What happens if you can influence the query instead of only searching for products? <br>
challenge.hint.2=The application executes a query similar to:<br> \
`SELECT name, category, price, description FROM products WHERE name LIKE '%your_input%'` \
<br><br> The database expects a specific number of columns in the result. \
Can you find out how many columns the original query returns? <br><br>
challenge.hint.3=Research how `UNION SELECT` combines results from multiple queries.<br><br>\
Your injected query must return the same number of columns as the original query.\
Start by testing with `NULL` values and identify which columns are displayed.<br><br>\
Once you know which columns are reflected, look for other tables that may contain interesting information.

# Flag related
challenge.message.invalid=Invalid credentials.

